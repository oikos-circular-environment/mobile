name: Production

on:
  push:
    branches: ['production']

jobs:
  quality:
    name: Quality checks
    type: custom
    steps:
      - uses: eas/checkout
      - run: npm ci
      - run: npx biome ci .
      - run: npm test

  fingerprint:
    name: Calculate fingerprint
    type: fingerprint
    needs: [quality]
    environment: production

  get_build_android:
    name: Find matching Android build
    type: get-build
    needs: [fingerprint]
    params:
      platform: android
      channel: production
      distribution: store
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}

  get_build_ios:
    name: Find matching iOS build
    type: get-build
    needs: [fingerprint]
    params:
      platform: ios
      channel: production
      distribution: store
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}

  check_ios_version:
    name: Check iOS version is editable on App Store
    type: custom
    needs: [get_build_android, get_build_ios]
    if: ${{ !needs.get_build_android.outputs.build_id || !needs.get_build_ios.outputs.build_id }}
    steps:
      - uses: eas/checkout
      - run: npm ci
      - run: node scripts/check-ios-app-version.mjs

  build_android:
    name: Build Android app
    type: build
    needs: [check_ios_version, get_build_android, get_build_ios]
    if: ${{ !needs.get_build_android.outputs.build_id || !needs.get_build_ios.outputs.build_id }}
    params:
      platform: android
      profile: production
  build_ios:
    name: Build iOS app
    type: build
    needs: [check_ios_version, get_build_android, get_build_ios]
    if: ${{ !needs.get_build_android.outputs.build_id || !needs.get_build_ios.outputs.build_id }}
    params:
      platform: ios
      profile: production
  submit_android:
    name: Submit Android
    type: submit
    needs: [build_android]
    env:
      EXPO_DEBUG: "1"
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production
  submit_ios:
    name: Submit iOS
    type: submit
    needs: [build_ios]
    env:
      EXPO_DEBUG: "1"
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production

  # `submit_ios` (fastlane pilot) só faz upload do binário. Este job cria a App
  # Store Version, anexa o build, publica metadata/screenshots e envia para o
  # App Review — sem ele o release fica parado na App Store Connect.
  submit_for_review:
    name: Submit iOS version for App Review
    type: custom
    needs: [submit_ios, build_ios]
    steps:
      - uses: eas/checkout
      - run: npm ci
      - name: Submit for review
        env:
          IOS_BUILD_NUMBER: ${{ needs.build_ios.outputs.app_build_version }}
        run: node scripts/submit-ios-for-review.mjs

  publish_update:
    name: Publish OTA update
    type: update
    needs: [get_build_android, get_build_ios]
    if: ${{ needs.get_build_android.outputs.build_id && needs.get_build_ios.outputs.build_id }}
    params:
      channel: production
