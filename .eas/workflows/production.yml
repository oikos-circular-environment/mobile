name: Production

on:
  push:
    branches: ['production']
  # Reexecuta só a publicação sem novo push: get_build_* reusa o build já
  # feito pelo fingerprint em vez de reconstruir.
  workflow_dispatch:
    inputs:
      reason:
        type: string
        required: false
        description: 'Motivo da execução manual (aparece no log do run)'

jobs:
  quality:
    name: Quality checks
    type: custom
    steps:
      - uses: eas/checkout
      - run: npm ci
      - run: npx biome ci .
      - run: npm test

  fingerprint:
    name: Calculate fingerprint
    type: fingerprint
    needs: [quality]
    environment: production

  get_build_android:
    name: Find matching Android build
    type: get-build
    needs: [fingerprint]
    params:
      platform: android
      channel: production
      distribution: store
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}

  get_build_ios:
    name: Find matching iOS build
    type: get-build
    needs: [fingerprint]
    params:
      platform: ios
      channel: production
      distribution: store
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}

  check_ios_version:
    name: Check iOS version is editable on App Store
    type: custom
    needs: [get_build_android, get_build_ios]
    if: ${{ !needs.get_build_android.outputs.build_id || !needs.get_build_ios.outputs.build_id }}
    steps:
      - uses: eas/checkout
      - run: npm ci
      - run: node scripts/check-ios-app-version.mjs

  build_android:
    name: Build Android app
    type: build
    needs: [check_ios_version, get_build_android, get_build_ios]
    if: ${{ !needs.get_build_android.outputs.build_id || !needs.get_build_ios.outputs.build_id }}
    params:
      platform: android
      profile: production
  build_ios:
    name: Build iOS app
    type: build
    needs: [check_ios_version, get_build_android, get_build_ios]
    if: ${{ !needs.get_build_android.outputs.build_id || !needs.get_build_ios.outputs.build_id }}
    params:
      platform: ios
      profile: production
  submit_android:
    name: Submit Android
    type: submit
    needs: [build_android]
    env:
      EXPO_DEBUG: "1"
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production

  # Publica notas da versão e trilha de destino, etapas que o `submit_android`
  # não cobre. Ver docs/publishing-path.md.
  publish_android:
    name: Publish Android release notes and track
    type: custom
    needs: [submit_android, build_android]
    # needs.*.outputs só resolve em env no nível do job — em env de step
    # individual a expressão ${{ }} chega como string literal (foi o que
    # quebrou a submissão da 1.0.2).
    env:
      ANDROID_VERSION_CODE: ${{ needs.build_android.outputs.app_build_version }}
    steps:
      - uses: eas/checkout
      - run: npm ci
      - name: Publish Android release
        run: node scripts/publish-android-release.mjs

  # Só sobe o binário — anexar, publicar ficha e enviar pra revisão dependem
  # do processamento na Apple e vivem em ios-review-submission.yml (trigger app_store_connect).
  submit_ios:
    name: Submit iOS
    type: submit
    needs: [build_ios]
    env:
      EXPO_DEBUG: "1"
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production

  publish_update:
    name: Publish OTA update
    type: update
    needs: [get_build_android, get_build_ios]
    if: ${{ needs.get_build_android.outputs.build_id && needs.get_build_ios.outputs.build_id }}
    params:
      channel: production

  notify:
    name: Notify release status
    type: github-comment
    after: [publish_android, submit_ios, publish_update]
    params:
      message: |
        **Release de produção** (fingerprint iOS `${{ needs.fingerprint.outputs.ios_fingerprint_hash }}`, Android `${{ needs.fingerprint.outputs.android_fingerprint_hash }}`)

        - Android — trilha/notas: ${{ after.publish_android.status }}
        - iOS — upload do binário: ${{ after.submit_ios.status }}
        - OTA: ${{ after.publish_update.status }}

        A finalização do release iOS (ficha + anexar build + enviar pra revisão) roda em outro workflow, disparado quando a Apple terminar de processar o upload. Acompanhe em `ios-review-submission.yml`.
