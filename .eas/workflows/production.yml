name: Production

on:
  push:
    branches: ['production']

jobs:
  quality:
    name: Quality checks
    type: custom
    steps:
      - uses: eas/checkout
      - run: npm ci
      - run: npx biome ci .
      - run: npm test

  fingerprint:
    name: Calculate fingerprint
    type: fingerprint
    needs: [quality]
    environment: production

  get_build_android:
    name: Find matching Android build
    type: get-build
    needs: [fingerprint]
    params:
      platform: android
      channel: production
      distribution: store
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}

  get_build_ios:
    name: Find matching iOS build
    type: get-build
    needs: [fingerprint]
    params:
      platform: ios
      channel: production
      distribution: store
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}

  check_ios_version:
    name: Check iOS version is editable on App Store
    type: custom
    needs: [get_build_android, get_build_ios]
    if: ${{ !needs.get_build_android.outputs.build_id || !needs.get_build_ios.outputs.build_id }}
    steps:
      - uses: eas/checkout
      - run: npm ci
      - run: node scripts/check-ios-app-version.mjs

  build_android:
    name: Build Android app
    type: build
    needs: [check_ios_version, get_build_android, get_build_ios]
    if: ${{ !needs.get_build_android.outputs.build_id || !needs.get_build_ios.outputs.build_id }}
    params:
      platform: android
      profile: production
  build_ios:
    name: Build iOS app
    type: build
    needs: [check_ios_version, get_build_android, get_build_ios]
    if: ${{ !needs.get_build_android.outputs.build_id || !needs.get_build_ios.outputs.build_id }}
    params:
      platform: ios
      profile: production
  submit_android:
    name: Submit Android
    type: submit
    needs: [build_android]
    env:
      EXPO_DEBUG: "1"
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production

  # Publica notas da versão e trilha de destino, etapas que o `submit_android`
  # não cobre. Ver docs/publishing-path.md.
  publish_android:
    name: Publish Android release notes and track
    type: custom
    needs: [submit_android, build_android]
    env:
      ANDROID_VERSION_CODE: ${{ needs.build_android.outputs.app_build_version }}
    steps:
      - uses: eas/checkout
      - run: npm ci
      - name: Publish Android release
        run: node scripts/publish-android-release.mjs
  submit_ios:
    name: Submit iOS
    type: submit
    needs: [build_ios]
    env:
      EXPO_DEBUG: "1"
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production

  # Fecha o release iOS em três etapas: anexar o build à App Store Version,
  # publicar a ficha com o EAS Metadata e enviar para o App Review.
  # Ver docs/publishing-path.md.
  submit_for_review:
    name: Submit iOS version for App Review
    type: custom
    needs: [submit_ios, build_ios]
    env:
      IOS_BUILD_NUMBER: ${{ needs.build_ios.outputs.app_build_version }}
    steps:
      - uses: eas/checkout
      - run: npm ci
      - name: Attach build to App Store version
        run: node scripts/submit-ios-for-review.mjs --skip-submit
      # EXPO_APPLE_TEAM_ID é redundante com o appleTeamId do eas.json, mas o
      # comando ainda abre prompt sem ele — e prompt em CI é falha.
      - name: Push store metadata
        env:
          EXPO_APPLE_TEAM_ID: "339A2VX3JG"
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
        run: npx eas metadata:push --non-interactive
      - name: Submit for review
        run: node scripts/submit-ios-for-review.mjs

  publish_update:
    name: Publish OTA update
    type: update
    needs: [get_build_android, get_build_ios]
    if: ${{ needs.get_build_android.outputs.build_id && needs.get_build_ios.outputs.build_id }}
    params:
      channel: production
