name: Build and submit

on:
  push:
    branches: ['production']

jobs:
  quality:
    name: Quality checks
    type: custom
    steps:
      - uses: eas/checkout
      - run: npm ci
      - run: npx biome ci .
      - run: npm test

  check_ios_version:
    name: Check iOS version is editable on App Store
    type: custom
    needs: [quality]
    steps:
      - uses: eas/checkout
      - run: npm ci
      - run: node scripts/check-ios-app-version.mjs

  build_android:
    name: Build Android app
    type: build
    needs: [check_ios_version]
    params:
      platform: android
      profile: production
  build_ios:
    name: Build iOS app
    type: build
    needs: [check_ios_version]
    params:
      platform: ios
      profile: production
  submit_android:
    name: Submit Android
    type: submit
    needs: [build_android]
    env:
      EXPO_DEBUG: "1"
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production
  submit_ios:
    name: Submit iOS
    type: submit
    needs: [build_ios]
    env:
      EXPO_DEBUG: "1"
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
