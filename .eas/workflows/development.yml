name: Development

on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [android, ios, all]
        required: true
        description: 'Plataforma pra gerar o dev client'
      ios_simulator:
        type: boolean
        required: false
        default: false
        description: 'iOS: build pra simulador em vez de aparelho físico'

jobs:
  build_android:
    name: Build Android (dev client)
    type: build
    if: ${{ inputs.platform == 'android' || inputs.platform == 'all' }}
    params:
      platform: android
      profile: development

  build_ios_device:
    name: Build iOS (dev client, aparelho)
    type: build
    if: ${{ (inputs.platform == 'ios' || inputs.platform == 'all') && !inputs.ios_simulator }}
    params:
      platform: ios
      profile: development

  build_ios_simulator:
    name: Build iOS (dev client, simulador)
    type: build
    if: ${{ (inputs.platform == 'ios' || inputs.platform == 'all') && inputs.ios_simulator }}
    params:
      platform: ios
      profile: development-simulator
